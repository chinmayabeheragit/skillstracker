<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Skill Tracker 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#08080d;--bg2:#0f0f18;--bg3:#17171f;--bg4:#1e1e28;
  --border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.12);
  --text:#eeeef5;--text2:#8888a8;--text3:#44445a;
  --accent:#7c6aff;--accent2:#a89bff;
  --green:#22c55e;--green-bg:rgba(34,197,94,0.1);
  --amber:#f59e0b;--amber-bg:rgba(245,158,11,0.1);
  --red:#ef4444;--red-bg:rgba(239,68,68,0.1);
  --blue:#60a5fa;--blue-bg:rgba(96,165,250,0.1);
  --cyan:#22d3ee;--cyan-bg:rgba(34,211,238,0.1);
  --purple:#c084fc;--purple-bg:rgba(192,132,252,0.1);
  --r:10px;--r2:7px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

.topnav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:56px;background:rgba(8,8,13,0.95);border-bottom:1px solid var(--border);}
.logo{font-size:15px;font-weight:700;color:var(--accent2);}
.logo em{color:var(--text3);font-style:normal;font-weight:400;}
.nav-right{display:flex;align-items:center;gap:8px;}
.sync-pill{font-size:11px;font-family:'JetBrains Mono',monospace;padding:3px 10px;border-radius:99px;border:1px solid var(--border2);color:var(--text3);}
.sync-pill.ok{color:var(--green);border-color:rgba(34,197,94,0.3);}
.sync-pill.busy{color:var(--amber);border-color:rgba(245,158,11,0.3);}
.sync-pill.err{color:var(--red);border-color:rgba(239,68,68,0.3);}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r2);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:500;cursor:pointer;transition:all 0.15s;}
.btn:hover{border-color:rgba(255,255,255,0.2);color:var(--text);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
.btn.primary:hover{opacity:0.85;}

.layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 56px);}
.sidebar{border-right:1px solid var(--border);padding:1rem 0.75rem;position:sticky;top:56px;height:calc(100vh - 56px);overflow-y:auto;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--border2);border-radius:99px;}

.prog-ring{padding:0.75rem;margin-bottom:0.75rem;text-align:center;}
.ring-wrap{position:relative;width:80px;height:80px;margin:0 auto 0.5rem;}
.ring-svg{width:80px;height:80px;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--bg4);stroke-width:5;}
.ring-arc{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 0.5s ease;}
.ring-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:17px;font-weight:700;}
.prog-lbl{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;}

.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:1rem;}
.mstat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:8px;text-align:center;}
.mstat .n{font-size:18px;font-weight:700;}
.mstat .l{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:1px;}

.nav-sec{font-size:10px;color:var(--text3);letter-spacing:0.08em;text-transform:uppercase;padding:0 8px;margin:0.75rem 0 4px;font-family:'JetBrains Mono',monospace;}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--r2);cursor:pointer;font-size:12.5px;color:var(--text2);transition:all 0.12s;margin-bottom:2px;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:rgba(124,106,255,0.12);color:var(--accent2);}
.nav-item .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:128px;}
.nav-badge{font-size:10px;font-family:'JetBrains Mono',monospace;background:var(--bg4);padding:1px 6px;border-radius:99px;color:var(--text3);flex-shrink:0;}
.nav-item.active .nav-badge{background:rgba(124,106,255,0.2);color:var(--accent2);}

.content{padding:1.25rem 1.5rem;}
.toolbar{display:flex;align-items:center;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap;}
.search{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13px;padding:7px 12px;width:200px;outline:none;transition:border-color 0.2s;}
.search:focus{border-color:var(--accent);}
.search::placeholder{color:var(--text3);}
.fsel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);color:var(--text2);font-family:'Space Grotesk',sans-serif;font-size:13px;padding:7px 10px;outline:none;cursor:pointer;}
.fsel option{background:var(--bg2);}

.section{margin-bottom:1.75rem;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.sec-title{font-size:13px;font-weight:600;}
.sec-meta{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.sec-bar{height:2px;background:var(--bg4);border-radius:99px;margin-bottom:10px;overflow:hidden;}
.sec-bar-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;display:flex;align-items:flex-start;gap:10px;transition:border-color 0.15s,transform 0.15s;position:relative;}
.card:hover{border-color:var(--border2);transform:translateY(-1px);}
.card.done{background:var(--green-bg);border-color:rgba(34,197,94,0.2);}
.card.done .cname{color:rgba(255,255,255,0.3);text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.15);}
.card.in_progress{border-color:rgba(192,132,252,0.25);background:rgba(192,132,252,0.04);}

.ckbtn{width:20px;height:20px;min-width:20px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:all 0.15s;font-size:10px;color:transparent;font-family:'JetBrains Mono',monospace;}
.card.done .ckbtn{background:var(--green);border-color:var(--green);color:#fff;}
.card.in_progress .ckbtn{background:var(--purple-bg);border-color:var(--purple);color:var(--purple);}
.ckbtn:hover{border-color:var(--green);background:var(--green-bg);}

.cbody{flex:1;min-width:0;}
.cname{font-size:12.5px;line-height:1.5;margin-bottom:5px;word-break:break-word;}
.ctags{display:flex;gap:5px;flex-wrap:wrap;}
.tag{font-size:10px;padding:2px 7px;border-radius:99px;font-weight:600;font-family:'JetBrains Mono',monospace;}
.p-critical{background:var(--red-bg);color:var(--red);}
.p-important{background:var(--amber-bg);color:var(--amber);}
.p-high{background:var(--blue-bg);color:var(--blue);}
.p-medium{background:var(--bg4);color:var(--text3);}
.p-metlife{background:var(--cyan-bg);color:var(--cyan);}
.s-in_progress{background:var(--purple-bg);color:var(--purple);}
.s-done{background:var(--green-bg);color:var(--green);}

.cactions{display:flex;gap:3px;opacity:0;transition:opacity 0.12s;flex-shrink:0;}
.card:hover .cactions{opacity:1;}
.act{width:26px;height:26px;border-radius:5px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.12s;}
.act:hover{border-color:var(--border2);color:var(--text);}
.act.del:hover{border-color:var(--red);color:var(--red);background:var(--red-bg);}
.act svg{width:13px;height:13px;pointer-events:none;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:1000;display:none;align-items:center;justify-content:center;padding:1.5rem;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:1.75rem;width:100%;max-width:460px;animation:mIn 0.18s ease;}
@keyframes mIn{from{opacity:0;transform:translateY(8px) scale(0.97);}to{opacity:1;transform:none;}}
.mtitle{font-size:16px;font-weight:700;margin-bottom:1.2rem;}
.fg{margin-bottom:0.85rem;}
.fl{font-size:11px;color:var(--text2);margin-bottom:5px;display:block;font-family:'JetBrains Mono',monospace;}
.fi,.fta,.fse{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-family:'Space Grotesk',sans-serif;font-size:13.5px;padding:9px 12px;outline:none;transition:border-color 0.15s;}
.fi:focus,.fta:focus,.fse:focus{border-color:var(--accent);}
.fi::placeholder,.fta::placeholder{color:var(--text3);}
.fta{resize:vertical;min-height:68px;}
.fse option{background:var(--bg2);}

/* Priority chips */
.prow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.pchip{padding:6px 2px;border-radius:var(--r2);border:1px solid var(--border);background:var(--bg3);color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.12s;}
.pchip:hover{border-color:var(--border2);color:var(--text2);}
.pchip.on-critical{background:var(--red-bg);border-color:var(--red);color:var(--red);}
.pchip.on-important{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}
.pchip.on-high{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}
.pchip.on-medium{background:var(--bg4);border-color:var(--border2);color:var(--text2);}
.pchip.on-metlife{background:var(--cyan-bg);border-color:var(--cyan);color:var(--cyan);}

.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:1.2rem;}
.bcancel{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text2);font-family:'Space Grotesk',sans-serif;font-size:13px;padding:8px 18px;cursor:pointer;}
.bcancel:hover{border-color:var(--border2);color:var(--text);}
.bsave{background:var(--accent);border:none;border-radius:var(--r2);color:#fff;font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;padding:8px 22px;cursor:pointer;}
.bsave:hover{opacity:0.85;}
.bsave:disabled{opacity:0.4;cursor:not-allowed;}

/* Error banner */
.errbanner{background:var(--red-bg);border:1px solid rgba(239,68,68,0.3);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:1rem;font-size:13px;color:var(--red);display:none;}
.errbanner.show{display:block;}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 16px;font-size:13px;z-index:9999;transform:translateY(50px);opacity:0;transition:all 0.22s cubic-bezier(.4,0,.2,1);max-width:260px;}
.toast.show{transform:none;opacity:1;}
.toast.ok{border-color:rgba(34,197,94,0.4);}
.toast.fail{border-color:rgba(239,68,68,0.4);}

.center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem;gap:0.75rem;color:var(--text3);}
.spin{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}
.center p{font-size:13px;}
.center b{font-size:15px;font-weight:600;color:var(--text2);}

@media(max-width:680px){.layout{grid-template-columns:1fr;}.sidebar{display:none;}.search{width:100%;}}
</style>
</head>
<body>

<nav class="topnav">
  <div class="logo">skill<em>·</em>tracker <em>2026</em></div>
  <div class="nav-right">
    <span class="sync-pill busy" id="sync">connecting...</span>
    <button class="btn" onclick="load()">↺ refresh</button>
    <button class="btn primary" onclick="openAdd()">+ add skill</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <div class="prog-ring">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 80 80">
          <circle class="ring-bg" cx="40" cy="40" r="34"/>
          <circle class="ring-arc" id="rarc" cx="40" cy="40" r="34" stroke-dasharray="213.63" stroke-dashoffset="213.63"/>
        </svg>
        <div class="ring-num" id="rpct">0%</div>
      </div>
      <p class="prog-lbl" id="rlbl">0 / 0 done</p>
    </div>
    <div class="mini-stats">
      <div class="mstat"><div class="n" id="sd" style="color:var(--green)">0</div><div class="l">done</div></div>
      <div class="mstat"><div class="n" id="sr" style="color:var(--amber)">0</div><div class="l">left</div></div>
      <div class="mstat"><div class="n" id="sc" style="color:var(--red)">0</div><div class="l">critical</div></div>
      <div class="mstat"><div class="n" id="sp2" style="color:var(--purple)">0</div><div class="l">in progress</div></div>
    </div>
    <p class="nav-sec">categories</p>
    <div id="nav"></div>
  </aside>
  <main class="content">
    <div class="errbanner" id="errbanner"></div>
    <div class="toolbar">
      <input class="search" id="q" placeholder="search..." oninput="render()"/>
      <select class="fsel" id="fp" onchange="render()">
        <option value="">all priorities</option>
        <option value="critical">critical</option>
        <option value="important">important</option>
        <option value="high">high</option>
        <option value="medium">medium</option>
        <option value="metlife">metlife</option>
      </select>
      <select class="fsel" id="fs" onchange="render()">
        <option value="">all status</option>
        <option value="pending">pending</option>
        <option value="in_progress">in progress</option>
        <option value="done">done</option>
      </select>
    </div>
    <div id="box"><div class="center"><div class="spin"></div><p>Connecting to Supabase...</p></div></div>
  </main>
</div>

<!-- Modal -->
<div class="overlay" id="ov">
  <div class="modal">
    <div class="mtitle" id="mtitle">add skill</div>
    <div class="fg"><label class="fl">skill name *</label><textarea class="fta" id="fn" placeholder="e.g. Implement debounce from scratch" rows="2"></textarea></div>
    <div class="fg"><label class="fl">category *</label><input class="fi" id="fcat" placeholder="e.g. JavaScript Core" list="cdl"/><datalist id="cdl"></datalist></div>
    <div class="fg">
      <label class="fl">priority *</label>
      <div class="prow" id="prow">
        <div class="pchip on-critical" data-v="critical" onclick="pickP(this)">critical</div>
        <div class="pchip" data-v="important" onclick="pickP(this)">important</div>
        <div class="pchip" data-v="high" onclick="pickP(this)">high</div>
        <div class="pchip" data-v="medium" onclick="pickP(this)">medium</div>
        <div class="pchip" data-v="metlife" onclick="pickP(this)">metlife</div>
      </div>
    </div>
    <div class="fg"><label class="fl">status *</label>
      <select class="fse" id="fst">
        <option value="pending">pending</option>
        <option value="in_progress">in progress</option>
        <option value="done">done</option>
      </select>
    </div>
    <div class="fg"><label class="fl">notes (optional)</label><textarea class="fta" id="fnotes" placeholder="Resources, links, reminders..." rows="2"></textarea></div>
    <div class="mfoot">
      <button class="bcancel" onclick="closeM()">cancel</button>
      <button class="bsave" id="bsave" onclick="save()">save skill</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const URL  = 'https://citdgaebrwjlwpnzzvuq.supabase.co';
const KEY  = 'sb_publishable_eKqbldxNkQBTCXEW6M3MiA_uWHdYUju';

const HDR = {
  'Content-Type': 'application/json',
  'apikey': KEY,
  'Authorization': 'Bearer ' + KEY,
  'Prefer': 'return=representation'
};

async function api(method, path, body){
  const opts = { method, headers: {...HDR} };
  if(body) opts.body = JSON.stringify(body);
  const res = await fetch(URL + '/rest/v1/' + path, opts);
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch(e){}
  if(!res.ok) throw new Error((data && (data.message || data.hint || data.error)) || ('HTTP ' + res.status));
  return data;
}

let skills=[], editId=null, cat='all', selP='critical';

async function load(){
  sync('busy','syncing...');
  try {
    const data = await api('GET','skills?select=*&order=category,created_at');
    skills = data || [];
    updateStats(); renderNav(); render();
    sync('ok','● live');
    hideErr();
  } catch(e) {
    sync('err','● error');
    showErr(e.message);
  }
}

function sync(cls, txt){ const el=document.getElementById('sync'); el.className='sync-pill '+cls; el.textContent=txt; }
function showErr(msg){ const el=document.getElementById('errbanner'); el.textContent='Error: '+msg+' — Check Supabase table exists and RLS is disabled (or set to allow all).'; el.classList.add('show'); }
function hideErr(){ document.getElementById('errbanner').classList.remove('show'); }

function updateStats(){
  const done=skills.filter(s=>s.status==='done').length, tot=skills.length;
  const pct=tot?Math.round(done/tot*100):0, C=213.63;
  document.getElementById('rarc').style.strokeDashoffset = C-(C*pct/100);
  document.getElementById('rpct').textContent = pct+'%';
  document.getElementById('rlbl').textContent = done+' / '+tot+' done';
  document.getElementById('sd').textContent = done;
  document.getElementById('sr').textContent = tot-done;
  document.getElementById('sc').textContent = skills.filter(s=>s.priority==='critical'&&s.status!=='done').length;
  document.getElementById('sp2').textContent = skills.filter(s=>s.status==='in_progress').length;
}

function renderNav(){
  const cats=['all',...new Set(skills.map(s=>s.category))];
  document.getElementById('cdl').innerHTML=[...new Set(skills.map(s=>s.category))].map(c=>`<option value="${c}">`).join('');
  document.getElementById('nav').innerHTML=cats.map(c=>{
    const arr=c==='all'?skills:skills.filter(s=>s.category===c);
    const d=arr.filter(s=>s.status==='done').length;
    return`<div class="nav-item${cat===c?' active':''}" onclick="setCat(${JSON.stringify(c)})">
      <span class="cn">${c==='all'?'all skills':c}</span>
      <span class="nav-badge">${d}/${arr.length}</span>
    </div>`;
  }).join('');
}

function setCat(c){ cat=c; renderNav(); render(); }

function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const fp=document.getElementById('fp').value;
  const fs=document.getElementById('fs').value;
  const filtered=skills.filter(s=>{
    if(cat!=='all'&&s.category!==cat) return false;
    if(q&&!s.name.toLowerCase().includes(q)&&!s.category.toLowerCase().includes(q)) return false;
    if(fp&&s.priority!==fp) return false;
    if(fs&&s.status!==fs) return false;
    return true;
  });
  const box=document.getElementById('box');
  if(!filtered.length){
    box.innerHTML=`<div class="center"><b>Nothing found</b><p>Try a different filter or add a new skill</p></div>`;
    return;
  }
  const byCat={};
  filtered.forEach(s=>{ (byCat[s.category]=byCat[s.category]||[]).push(s); });
  box.innerHTML=Object.entries(byCat).map(([c,arr])=>{
    const d=arr.filter(s=>s.status==='done').length;
    const pct=Math.round(d/arr.length*100);
    return`<div class="section">
      <div class="sec-head"><div class="sec-title">${c}</div><div class="sec-meta">${d}/${arr.length} · ${pct}%</div></div>
      <div class="sec-bar"><div class="sec-bar-fill" style="width:${pct}%"></div></div>
      <div class="grid">${arr.map(cardHTML).join('')}</div>
    </div>`;
  }).join('');
}

const PTAG={critical:'p-critical',important:'p-important',high:'p-high',medium:'p-medium',metlife:'p-metlife'};

function cardHTML(s){
  const done=s.status==='done', prog=s.status==='in_progress';
  const ckIcon=done?'✓':prog?'▶':'';
  const cls=done?' done':prog?' in_progress':'';
  const stag=done?`<span class="tag s-done">✓ done</span>`:prog?`<span class="tag s-in_progress">▶ in progress</span>`:'';
  return`<div class="card${cls}">
    <button class="ckbtn" title="cycle status" onclick="cycle(${JSON.stringify(s.id)})">${ckIcon}</button>
    <div class="cbody">
      <div class="cname">${esc(s.name)}</div>
      <div class="ctags">
        <span class="tag ${PTAG[s.priority]||'p-medium'}">${s.priority}</span>
        ${stag}
        ${s.notes?`<span class="tag" style="background:var(--bg4);color:var(--text3)">📝</span>`:''}
      </div>
    </div>
    <div class="cactions">
      <button class="act" title="edit" onclick="openEdit(${JSON.stringify(s.id)})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
      <button class="act del" title="delete" onclick="del(${JSON.stringify(s.id)})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
    </div>
  </div>`;
}

function esc(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }

async function cycle(id){
  const s=skills.find(x=>x.id===id); if(!s) return;
  const order=['pending','in_progress','done'];
  const next=order[(order.indexOf(s.status||'pending')+1)%3];
  sync('busy','syncing...');
  try {
    await api('PATCH',`skills?id=eq.${id}`,{status:next});
    s.status=next;
    updateStats(); renderNav(); render();
    sync('ok','● live');
    toast(next==='done'?'✓ done!':next==='in_progress'?'▶ in progress':'○ pending','ok');
  } catch(e){ sync('err','● error'); toast(e.message,'fail'); }
}

function pickP(el){
  document.querySelectorAll('#prow .pchip').forEach(o=>o.className='pchip');
  el.classList.add('on-'+el.dataset.v);
  selP=el.dataset.v;
}

function openAdd(){
  editId=null;
  document.getElementById('mtitle').textContent='add skill';
  document.getElementById('bsave').textContent='save skill';
  document.getElementById('fn').value='';
  document.getElementById('fcat').value=cat!=='all'?cat:'';
  document.getElementById('fst').value='pending';
  document.getElementById('fnotes').value='';
  selP='critical';
  document.querySelectorAll('#prow .pchip').forEach(o=>{ o.className='pchip'+(o.dataset.v==='critical'?' on-critical':''); });
  document.getElementById('ov').classList.add('open');
}

function openEdit(id){
  const s=skills.find(x=>x.id===id); if(!s) return;
  editId=id;
  document.getElementById('mtitle').textContent='edit skill';
  document.getElementById('bsave').textContent='update';
  document.getElementById('fn').value=s.name;
  document.getElementById('fcat').value=s.category;
  document.getElementById('fst').value=s.status||'pending';
  document.getElementById('fnotes').value=s.notes||'';
  selP=s.priority;
  document.querySelectorAll('#prow .pchip').forEach(o=>{ o.className='pchip'+(o.dataset.v===s.priority?' on-'+s.priority:''); });
  document.getElementById('ov').classList.add('open');
}

function closeM(){ document.getElementById('ov').classList.remove('open'); }

async function save(){
  const name=document.getElementById('fn').value.trim();
  const category=document.getElementById('fcat').value.trim();
  const status=document.getElementById('fst').value;
  const notes=document.getElementById('fnotes').value.trim();
  if(!name||!category){ toast('Name and category required','fail'); return; }
  const btn=document.getElementById('bsave');
  btn.disabled=true; sync('busy','syncing...');
  try {
    const payload={name,category,priority:selP,status,notes};
    if(editId){
      await api('PATCH',`skills?id=eq.${editId}`,payload);
      toast('Updated!','ok');
    } else {
      await api('POST','skills',payload);
      toast('Added!','ok');
    }
    closeM(); await load();
  } catch(e){ sync('err','● error'); toast(e.message,'fail'); }
  btn.disabled=false;
}

async function del(id){
  if(!confirm('Delete this skill?')) return;
  sync('busy','syncing...');
  try {
    await api('DELETE',`skills?id=eq.${id}`,null);
    skills=skills.filter(s=>s.id!==id);
    updateStats(); renderNav(); render();
    sync('ok','● live'); toast('Deleted','ok');
  } catch(e){ sync('err','● error'); toast(e.message,'fail'); }
}

let _t;
function toast(msg,type='ok'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className='toast '+type+' show';
  clearTimeout(_t); _t=setTimeout(()=>el.classList.remove('show'),2600);
}

document.getElementById('ov').addEventListener('click',e=>{ if(e.target===document.getElementById('ov')) closeM(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeM(); });

load();
</script>
</body>
</html>
