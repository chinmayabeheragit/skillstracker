<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Skill Tracker 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#07080c;--bg2:#0d0e15;--bg3:#13141e;--bg4:#1a1b27;--bg5:#212230;
  --border:rgba(255,255,255,0.05);--border2:rgba(255,255,255,0.1);--border3:rgba(255,255,255,0.18);
  --text:#e8e9f5;--text2:#7e8099;--text3:#3e4055;
  --accent:#5b6aff;--accent2:#8b96ff;--accent-glow:rgba(91,106,255,0.18);
  --green:#1fd674;--green-bg:rgba(31,214,116,0.08);--green-border:rgba(31,214,116,0.2);
  --amber:#f0a500;--amber-bg:rgba(240,165,0,0.08);--amber-border:rgba(240,165,0,0.2);
  --red:#ff4d6a;--red-bg:rgba(255,77,106,0.08);--red-border:rgba(255,77,106,0.2);
  --blue:#4da6ff;--blue-bg:rgba(77,166,255,0.08);--blue-border:rgba(77,166,255,0.2);
  --cyan:#00d4c8;--cyan-bg:rgba(0,212,200,0.08);--cyan-border:rgba(0,212,200,0.2);
  --purple:#c97bff;--purple-bg:rgba(201,123,255,0.08);--purple-border:rgba(201,123,255,0.2);
  --r:10px;--r2:7px;--r3:5px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Syne',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}

/* Grain overlay */
body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4;}

.topnav{position:sticky;top:0;z-index:200;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:54px;background:rgba(7,8,12,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.logo{display:flex;align-items:center;gap:10px;}
.logo-mark{width:26px;height:26px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;}
.logo-text{font-size:14px;font-weight:700;letter-spacing:-0.02em;}
.logo-text em{color:var(--text3);font-style:normal;}
.status-dot{display:flex;align-items:center;gap:6px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--green);padding:4px 10px;border-radius:99px;border:1px solid var(--green-border);background:var(--green-bg);}
.status-dot::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;}
.nav-right{display:flex;align-items:center;gap:8px;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--r2);border:1px solid var(--border2);background:var(--bg3);color:var(--text2);font-family:'Syne',sans-serif;font-size:12.5px;font-weight:600;cursor:pointer;transition:all 0.15s;letter-spacing:0.01em;}
.btn:hover{border-color:var(--border3);color:var(--text);}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 20px var(--accent-glow);}
.btn.primary:hover{opacity:0.88;}

.layout{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 54px);position:relative;z-index:1;}
.sidebar{border-right:1px solid var(--border);padding:1.1rem 0.75rem;position:sticky;top:54px;height:calc(100vh - 54px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--bg5) transparent;}
.sidebar::-webkit-scrollbar{width:3px;}
.sidebar::-webkit-scrollbar-thumb{background:var(--bg5);border-radius:99px;}

/* Ring */
.prog-ring{padding:1rem 0.5rem 0.85rem;text-align:center;margin-bottom:0.5rem;}
.ring-wrap{position:relative;width:86px;height:86px;margin:0 auto 0.6rem;}
.ring-svg{width:86px;height:86px;transform:rotate(-90deg);}
.ring-bg{fill:none;stroke:var(--bg4);stroke-width:6;}
.ring-arc{fill:none;stroke:var(--accent);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1);}
.ring-arc2{fill:none;stroke:var(--green);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset 0.6s cubic-bezier(.4,0,.2,1);}
.ring-num{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:19px;font-weight:800;letter-spacing:-0.04em;}
.prog-lbl{font-size:10.5px;color:var(--text3);font-family:'JetBrains Mono',monospace;}

.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:1rem;}
.mstat{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);padding:7px 8px;text-align:center;}
.mstat .n{font-size:19px;font-weight:800;letter-spacing:-0.04em;}
.mstat .l{font-size:9.5px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-top:1px;text-transform:uppercase;letter-spacing:0.05em;}

.nav-sec{font-size:9.5px;color:var(--text3);letter-spacing:0.1em;text-transform:uppercase;padding:0 8px;margin:0.85rem 0 5px;font-family:'JetBrains Mono',monospace;}
.nav-item{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-radius:var(--r2);cursor:pointer;font-size:12px;color:var(--text2);transition:all 0.12s;margin-bottom:2px;gap:6px;}
.nav-item:hover{background:var(--bg3);color:var(--text);}
.nav-item.active{background:rgba(91,106,255,0.1);color:var(--accent2);}
.nav-item .cn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
.nav-badge{font-size:9.5px;font-family:'JetBrains Mono',monospace;background:var(--bg4);padding:1px 6px;border-radius:99px;color:var(--text3);flex-shrink:0;}
.nav-item.active .nav-badge{background:rgba(91,106,255,0.18);color:var(--accent2);}
.nav-prog{height:2px;background:var(--bg5);border-radius:99px;margin:3px 10px 5px;overflow:hidden;}
.nav-prog-fill{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s;}
.nav-item.active + .nav-prog .nav-prog-fill{background:var(--accent2);}

.content{padding:1.25rem 1.5rem;}
.toolbar{display:flex;align-items:center;gap:7px;margin-bottom:1.25rem;flex-wrap:wrap;}
.search{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-family:'Syne',sans-serif;font-size:13px;padding:7px 12px;width:190px;outline:none;transition:border-color 0.18s;}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.search::placeholder{color:var(--text3);}
.fsel{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r2);color:var(--text2);font-family:'Syne',sans-serif;font-size:12.5px;padding:7px 10px;outline:none;cursor:pointer;transition:border-color 0.15s;}
.fsel:focus{border-color:var(--accent);}
.fsel option{background:var(--bg2);}
.toolbar-right{margin-left:auto;display:flex;gap:7px;align-items:center;}
.count-badge{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text3);padding:5px 10px;border:1px solid var(--border);border-radius:99px;background:var(--bg2);}

.section{margin-bottom:2rem;}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;}
.sec-title{font-size:12px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:var(--text2);}
.sec-meta{font-size:10.5px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.sec-bar{height:2px;background:var(--bg4);border-radius:99px;margin-bottom:10px;overflow:hidden;}
.sec-bar-fill{height:100%;border-radius:99px;transition:width 0.5s cubic-bezier(.4,0,.2,1);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:7px;}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:11px 13px;display:flex;align-items:flex-start;gap:9px;transition:border-color 0.15s,transform 0.15s,box-shadow 0.15s;position:relative;cursor:default;}
.card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 4px 20px rgba(0,0,0,0.3);}
.card.done{background:rgba(31,214,116,0.04);border-color:var(--green-border);}
.card.done .cname{color:rgba(255,255,255,0.25);text-decoration:line-through;text-decoration-color:rgba(255,255,255,0.12);}
.card.in_progress{border-color:var(--purple-border);background:rgba(201,123,255,0.04);}

.ckbtn{width:19px;height:19px;min-width:19px;border-radius:50%;border:1.5px solid var(--border2);background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;margin-top:2px;transition:all 0.15s;font-size:9px;color:transparent;font-family:'JetBrains Mono',monospace;flex-shrink:0;}
.card.done .ckbtn{background:var(--green);border-color:var(--green);color:#fff;}
.card.in_progress .ckbtn{background:var(--purple-bg);border-color:var(--purple);color:var(--purple);font-size:8px;}
.ckbtn:hover{border-color:var(--green);background:var(--green-bg);color:var(--green);}
.card.done .ckbtn:hover{background:var(--amber);border-color:var(--amber);}

.cbody{flex:1;min-width:0;}
.cname{font-size:12px;line-height:1.5;margin-bottom:6px;word-break:break-word;font-weight:500;}
.ctags{display:flex;gap:4px;flex-wrap:wrap;}
.tag{font-size:9.5px;padding:2px 6px;border-radius:4px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:0.02em;}
.p-critical{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border);}
.p-important{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border);}
.p-high{background:var(--blue-bg);color:var(--blue);border:1px solid var(--blue-border);}
.p-medium{background:var(--bg4);color:var(--text3);border:1px solid var(--border);}
.p-metlife{background:var(--cyan-bg);color:var(--cyan);border:1px solid var(--cyan-border);}
.s-in_progress{background:var(--purple-bg);color:var(--purple);border:1px solid var(--purple-border);}
.s-done{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border);}

.cactions{display:flex;gap:3px;opacity:0;transition:opacity 0.12s;flex-shrink:0;}
.card:hover .cactions{opacity:1;}
.act{width:24px;height:24px;border-radius:4px;border:1px solid var(--border);background:var(--bg3);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.12s;}
.act:hover{border-color:var(--border2);color:var(--text);}
.act.del:hover{border-color:var(--red);color:var(--red);background:var(--red-bg);}
.act svg{width:12px;height:12px;pointer-events:none;}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:1.5rem;}
.overlay.open{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:1.6rem;width:100%;max-width:450px;animation:mIn 0.2s cubic-bezier(.34,1.56,.64,1);}
@keyframes mIn{from{opacity:0;transform:translateY(10px) scale(0.96);}to{opacity:1;transform:none;}}
.mtitle{font-size:15px;font-weight:800;margin-bottom:1.1rem;letter-spacing:-0.02em;}
.fg{margin-bottom:0.8rem;}
.fl{font-size:10.5px;color:var(--text2);margin-bottom:5px;display:block;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:0.06em;}
.fi,.fta,.fse{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text);font-family:'Syne',sans-serif;font-size:13px;padding:8px 11px;outline:none;transition:border-color 0.15s,box-shadow 0.15s;}
.fi:focus,.fta:focus,.fse:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-glow);}
.fi::placeholder,.fta::placeholder{color:var(--text3);}
.fta{resize:vertical;min-height:60px;}
.fse option{background:var(--bg3);}
.prow{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;}
.pchip{padding:7px 2px;border-radius:var(--r3);border:1px solid var(--border);background:var(--bg3);color:var(--text3);font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:600;cursor:pointer;text-align:center;transition:all 0.12s;letter-spacing:0.02em;}
.pchip:hover{border-color:var(--border2);color:var(--text2);}
.pchip.on-critical{background:var(--red-bg);border-color:var(--red);color:var(--red);}
.pchip.on-important{background:var(--amber-bg);border-color:var(--amber);color:var(--amber);}
.pchip.on-high{background:var(--blue-bg);border-color:var(--blue);color:var(--blue);}
.pchip.on-medium{background:var(--bg4);border-color:var(--border2);color:var(--text2);}
.pchip.on-metlife{background:var(--cyan-bg);border-color:var(--cyan);color:var(--cyan);}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:1.1rem;}
.bcancel{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);color:var(--text2);font-family:'Syne',sans-serif;font-size:12.5px;padding:8px 16px;cursor:pointer;font-weight:600;}
.bcancel:hover{border-color:var(--border2);color:var(--text);}
.bsave{background:var(--accent);border:none;border-radius:var(--r2);color:#fff;font-family:'Syne',sans-serif;font-size:12.5px;font-weight:700;padding:8px 20px;cursor:pointer;box-shadow:0 0 16px var(--accent-glow);}
.bsave:hover{opacity:0.88;}
.bsave:disabled{opacity:0.4;cursor:not-allowed;}

/* Reset banner */
.reset-wrap{display:flex;align-items:center;gap:8px;margin-left:auto;}
.btn-reset{background:var(--bg3);border:1px solid var(--red-border);border-radius:var(--r2);color:var(--red);font-family:'Syne',sans-serif;font-size:11.5px;font-weight:600;padding:5px 11px;cursor:pointer;transition:all 0.15s;}
.btn-reset:hover{background:var(--red-bg);}

.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--r2);padding:10px 15px;font-size:12.5px;z-index:9999;transform:translateY(40px);opacity:0;transition:all 0.22s cubic-bezier(.4,0,.2,1);max-width:250px;font-weight:600;}
.toast.show{transform:none;opacity:1;}
.toast.ok{border-color:var(--green-border);color:var(--green);}
.toast.fail{border-color:var(--red-border);color:var(--red);}

.center{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4rem 1rem;gap:0.75rem;color:var(--text3);}
.spin{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:sp 0.7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

.confirm-modal{max-width:360px;}
.confirm-msg{font-size:13px;color:var(--text2);margin-bottom:1.1rem;line-height:1.6;}

@media(max-width:700px){.layout{grid-template-columns:1fr;}.sidebar{display:none;}.search{width:100%;}}
</style>
</head>
<body>

<nav class="topnav">
  <div class="logo">
    <div class="logo-mark">S</div>
    <div class="logo-text">skill<em>·</em>tracker <em>2026</em></div>
  </div>
  <div class="nav-right">
    <span class="status-dot">local storage</span>
    <button class="btn primary" onclick="openAdd()">+ add skill</button>
  </div>
</nav>

<div class="layout">
  <aside class="sidebar">
    <div class="prog-ring">
      <div class="ring-wrap">
        <svg class="ring-svg" viewBox="0 0 86 86">
          <circle class="ring-bg" cx="43" cy="43" r="36"/>
          <circle class="ring-arc" id="rarc" cx="43" cy="43" r="36" stroke-dasharray="226.2" stroke-dashoffset="226.2"/>
        </svg>
        <div class="ring-num" id="rpct">0%</div>
      </div>
      <p class="prog-lbl" id="rlbl">0 / 0 done</p>
    </div>
    <div class="mini-stats">
      <div class="mstat"><div class="n" id="sd" style="color:var(--green)">0</div><div class="l">done</div></div>
      <div class="mstat"><div class="n" id="sr" style="color:var(--amber)">0</div><div class="l">left</div></div>
      <div class="mstat"><div class="n" id="sc" style="color:var(--red)">0</div><div class="l">critical</div></div>
      <div class="mstat"><div class="n" id="sp2" style="color:var(--purple)">0</div><div class="l">in prog</div></div>
    </div>
    <p class="nav-sec">categories</p>
    <div id="nav"></div>
  </aside>
  <main class="content">
    <div class="toolbar">
      <input class="search" id="q" placeholder="🔍 search skills..." oninput="render()"/>
      <select class="fsel" id="fp" onchange="render()">
        <option value="">all priorities</option>
        <option value="critical">critical</option>
        <option value="important">important</option>
        <option value="high">high</option>
        <option value="medium">medium</option>
        <option value="metlife">metlife</option>
      </select>
      <select class="fsel" id="fs" onchange="render()">
        <option value="">all status</option>
        <option value="pending">pending</option>
        <option value="in_progress">in progress</option>
        <option value="done">done</option>
      </select>
      <div class="toolbar-right">
        <span class="count-badge" id="cnt">0 skills</span>
        <button class="btn-reset" onclick="confirmReset()">↺ reset all</button>
      </div>
    </div>
    <div id="box"><div class="center"><div class="spin"></div></div></div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div class="overlay" id="ov">
  <div class="modal">
    <div class="mtitle" id="mtitle">add skill</div>
    <div class="fg"><label class="fl">skill name *</label><textarea class="fta" id="fn" placeholder="e.g. Implement debounce from scratch" rows="2"></textarea></div>
    <div class="fg"><label class="fl">category *</label><input class="fi" id="fcat" placeholder="e.g. JavaScript" list="cdl"/><datalist id="cdl"></datalist></div>
    <div class="fg">
      <label class="fl">priority *</label>
      <div class="prow" id="prow">
        <div class="pchip on-critical" data-v="critical" onclick="pickP(this)">critical</div>
        <div class="pchip" data-v="important" onclick="pickP(this)">important</div>
        <div class="pchip" data-v="high" onclick="pickP(this)">high</div>
        <div class="pchip" data-v="medium" onclick="pickP(this)">medium</div>
        <div class="pchip" data-v="metlife" onclick="pickP(this)">metlife</div>
      </div>
    </div>
    <div class="fg"><label class="fl">status *</label>
      <select class="fse" id="fst">
        <option value="pending">pending</option>
        <option value="in_progress">in progress</option>
        <option value="done">done</option>
      </select>
    </div>
    <div class="fg"><label class="fl">notes (optional)</label><textarea class="fta" id="fnotes" placeholder="Resources, links, reminders..." rows="2"></textarea></div>
    <div class="mfoot">
      <button class="bcancel" onclick="closeM()">cancel</button>
      <button class="bsave" id="bsave" onclick="save()">save skill</button>
    </div>
  </div>
</div>

<!-- Confirm Reset Modal -->
<div class="overlay" id="ov-confirm">
  <div class="modal confirm-modal">
    <div class="mtitle">reset all progress?</div>
    <p class="confirm-msg">This will reset ALL skills back to <strong>pending</strong>. Your custom added skills will stay. Only status is reset.</p>
    <div class="mfoot">
      <button class="bcancel" onclick="closeConfirm()">cancel</button>
      <button class="bsave" style="background:var(--red);box-shadow:0 0 16px var(--red-bg);" onclick="doReset()">yes, reset</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ─── SEED DATA — All skills from the document ───────────────────────────────
const SEED = [
  // JavaScript
  {id:'js1',category:'JavaScript',name:'Advanced JavaScript — Closures, Prototypes, this',priority:'critical',status:'pending',notes:''},
  {id:'js2',category:'JavaScript',name:'Event Loop — Phases, Microtasks, Macrotasks',priority:'critical',status:'pending',notes:''},
  {id:'js3',category:'JavaScript',name:'Async Patterns — Promises, async/await, error handling',priority:'critical',status:'pending',notes:''},
  {id:'js4',category:'JavaScript',name:'Modern JS Syntax — Destructuring, Optional Chaining, ESM (ES2020–2024)',priority:'important',status:'pending',notes:''},
  {id:'js5',category:'JavaScript',name:'Implement Promise.all from scratch',priority:'critical',status:'pending',notes:'Common ask at Atlassian, Canva, Google'},
  {id:'js6',category:'JavaScript',name:'Implement Promise.race from scratch',priority:'critical',status:'pending',notes:''},
  {id:'js7',category:'JavaScript',name:'Implement debounce from scratch',priority:'critical',status:'pending',notes:'Very common at all companies'},
  {id:'js8',category:'JavaScript',name:'Implement throttle from scratch',priority:'critical',status:'pending',notes:'Very common at all companies'},
  {id:'js9',category:'JavaScript',name:'WeakMap and WeakSet — use cases',priority:'high',status:'pending',notes:'Google, Meta'},
  {id:'js10',category:'JavaScript',name:'The `this` keyword — 5 different contexts',priority:'critical',status:'pending',notes:'Amazon, Google, Meta'},
  {id:'js11',category:'JavaScript',name:'call(), apply(), bind() with examples',priority:'critical',status:'pending',notes:''},

// ─── STATE ──────────────────────────────────────────────────────────────────
let skills = [], editId = null, cat = 'all', selP = 'critical';

// ─── STORAGE ─────────────────────────────────────────────────────────────────
async function loadStorage() {
  try {
    const saved = localStorage.getItem('skilltracker2026');
    if (saved) {
      skills = JSON.parse(saved);
    } else {
      skills = SEED.map(s => ({...s}));
      persistStorage();
    }
  } catch(e) {
    skills = SEED.map(s => ({...s}));
  }
}

function persistStorage() {
  try {
    localStorage.setItem('skilltracker2026', JSON.stringify(skills));
  } catch(e) {
    console.error('Save failed', e);
  }
}

// ─── BOOTSTRAP ───────────────────────────────────────────────────────────────
async function init() {
  await loadStorage();
  updateStats(); renderNav(); render();
}

// ─── STATS ───────────────────────────────────────────────────────────────────
function updateStats() {
  const done = skills.filter(s => s.status === 'done').length, tot = skills.length;
  const pct = tot ? Math.round(done / tot * 100) : 0, C = 226.2;
  document.getElementById('rarc').style.strokeDashoffset = C - (C * pct / 100);
  document.getElementById('rpct').textContent = pct + '%';
  document.getElementById('rlbl').textContent = done + ' / ' + tot + ' done';
  document.getElementById('sd').textContent = done;
  document.getElementById('sr').textContent = tot - done;
  document.getElementById('sc').textContent = skills.filter(s => s.priority === 'critical' && s.status !== 'done').length;
  document.getElementById('sp2').textContent = skills.filter(s => s.status === 'in_progress').length;
}

// ─── NAV ─────────────────────────────────────────────────────────────────────
function renderNav() {
  const cats = ['all', ...new Set(skills.map(s => s.category))];
  document.getElementById('cdl').innerHTML = [...new Set(skills.map(s => s.category))].map(c => `<option value="${c}">`).join('');
  document.getElementById('nav').innerHTML = cats.map(c => {
    const arr = c === 'all' ? skills : skills.filter(s => s.category === c);
    const d = arr.filter(s => s.status === 'done').length;
    const pct = arr.length ? Math.round(d / arr.length * 100) : 0;
    return `<div class="nav-item${cat === c ? ' active' : ''}" onclick="setCat(${JSON.stringify(c)})">
      <span class="cn">${c === 'all' ? '⬡ all skills' : c}</span>
      <span class="nav-badge">${d}/${arr.length}</span>
    </div>
    <div class="nav-prog"><div class="nav-prog-fill" style="width:${pct}%"></div></div>`;
  }).join('');
}

function setCat(c) { cat = c; renderNav(); render(); }

// ─── RENDER ──────────────────────────────────────────────────────────────────
function render() {
  const q = document.getElementById('q').value.toLowerCase();
  const fp = document.getElementById('fp').value;
  const fs = document.getElementById('fs').value;
  const filtered = skills.filter(s => {
    if (cat !== 'all' && s.category !== cat) return false;
    if (q && !s.name.toLowerCase().includes(q) && !s.category.toLowerCase().includes(q)) return false;
    if (fp && s.priority !== fp) return false;
    if (fs && s.status !== fs) return false;
    return true;
  });
  document.getElementById('cnt').textContent = filtered.length + ' skill' + (filtered.length !== 1 ? 's' : '');
  const box = document.getElementById('box');
  if (!filtered.length) {
    box.innerHTML = `<div class="center"><b style="color:var(--text2)">Nothing found</b><p>Try a different filter or add a new skill</p></div>`;
    return;
  }
  const byCat = {};
  filtered.forEach(s => { (byCat[s.category] = byCat[s.category] || []).push(s); });
  box.innerHTML = Object.entries(byCat).map(([c, arr]) => {
    const d = arr.filter(s => s.status === 'done').length;
    const pct = Math.round(d / arr.length * 100);
    const col = pct === 100 ? 'var(--green)' : pct > 50 ? 'var(--accent)' : 'var(--amber)';
    return `<div class="section">
      <div class="sec-head"><div class="sec-title">${c}</div><div class="sec-meta">${d}/${arr.length} · ${pct}%</div></div>
      <div class="sec-bar"><div class="sec-bar-fill" style="width:${pct}%;background:${col}"></div></div>
      <div class="grid">${arr.map(cardHTML).join('')}</div>
    </div>`;
  }).join('');
}

const PTAG = { critical: 'p-critical', important: 'p-important', high: 'p-high', medium: 'p-medium', metlife: 'p-metlife' };

function cardHTML(s) {
  const done = s.status === 'done', prog = s.status === 'in_progress';
  const ckIcon = done ? '✓' : prog ? '▶' : '';
  const cls = done ? ' done' : prog ? ' in_progress' : '';
  const stag = done ? `<span class="tag s-done">✓ done</span>` : prog ? `<span class="tag s-in_progress">▶ in prog</span>` : '';
  const sid = s.id.replace(/"/g, '&quot;');
  return `<div class="card${cls}">
    <button class="ckbtn" title="click to cycle: pending → in progress → done" data-action="cycle" data-id="${sid}">${ckIcon}</button>
    <div class="cbody">
      <div class="cname">${esc(s.name)}</div>
      <div class="ctags">
        <span class="tag ${PTAG[s.priority] || 'p-medium'}">${s.priority}</span>
        ${stag}
        ${s.notes ? `<span class="tag" style="background:var(--bg4);color:var(--text3);border:1px solid var(--border)">📝</span>` : ''}
      </div>
    </div>
    <div class="cactions">
      <button class="act" title="edit" data-action="edit" data-id="${sid}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg></button>
      <button class="act del" title="delete" data-action="del" data-id="${sid}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg></button>
    </div>
  </div>`;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ─── CYCLE STATUS ─────────────────────────────────────────────────────────────
function cycle(id) {
  const s = skills.find(x => x.id === id); if (!s) return;
  const order = ['pending', 'in_progress', 'done'];
  s.status = order[(order.indexOf(s.status || 'pending') + 1) % 3];
  updateStats(); renderNav(); render();
  persistStorage();
  const msg = s.status === 'done' ? '✓ marked done!' : s.status === 'in_progress' ? '▶ in progress' : '○ back to pending';
  toast(msg, 'ok');
}

// ─── MODAL ───────────────────────────────────────────────────────────────────
function pickP(el) {
  document.querySelectorAll('#prow .pchip').forEach(o => o.className = 'pchip');
  el.classList.add('on-' + el.dataset.v);
  selP = el.dataset.v;
}

function openAdd() {
  editId = null;
  document.getElementById('mtitle').textContent = 'add skill';
  document.getElementById('bsave').textContent = 'save skill';
  document.getElementById('fn').value = '';
  document.getElementById('fcat').value = cat !== 'all' ? cat : '';
  document.getElementById('fst').value = 'pending';
  document.getElementById('fnotes').value = '';
  selP = 'critical';
  document.querySelectorAll('#prow .pchip').forEach(o => { o.className = 'pchip' + (o.dataset.v === 'critical' ? ' on-critical' : ''); });
  document.getElementById('ov').classList.add('open');
}

function openEdit(id) {
  const s = skills.find(x => x.id === id); if (!s) return;
  editId = id;
  document.getElementById('mtitle').textContent = 'edit skill';
  document.getElementById('bsave').textContent = 'update';
  document.getElementById('fn').value = s.name;
  document.getElementById('fcat').value = s.category;
  document.getElementById('fst').value = s.status || 'pending';
  document.getElementById('fnotes').value = s.notes || '';
  selP = s.priority;
  document.querySelectorAll('#prow .pchip').forEach(o => { o.className = 'pchip' + (o.dataset.v === s.priority ? ' on-' + s.priority : ''); });
  document.getElementById('ov').classList.add('open');
}

function closeM() { document.getElementById('ov').classList.remove('open'); }

function save() {
  const name = document.getElementById('fn').value.trim();
  const category = document.getElementById('fcat').value.trim();
  const status = document.getElementById('fst').value;
  const notes = document.getElementById('fnotes').value.trim();
  if (!name || !category) { toast('Name and category required', 'fail'); return; }
  const btn = document.getElementById('bsave');
  btn.disabled = true;
  if (editId) {
    const s = skills.find(x => x.id === editId);
    if (s) { s.name = name; s.category = category; s.priority = selP; s.status = status; s.notes = notes; }
    toast('Updated!', 'ok');
  } else {
    skills.push({ id: 'custom_' + Date.now(), name, category, priority: selP, status, notes });
    toast('Added!', 'ok');
  }
  closeM();
  updateStats(); renderNav(); render();
  persistStorage();
  btn.disabled = false;
}

function del(id) {
  skills = skills.filter(s => s.id !== id);
  updateStats(); renderNav(); render();
  persistStorage();
  toast('Deleted', 'ok');
}

// ─── RESET ───────────────────────────────────────────────────────────────────
function confirmReset() { document.getElementById('ov-confirm').classList.add('open'); }
function closeConfirm() { document.getElementById('ov-confirm').classList.remove('open'); }
function doReset() {
  skills.forEach(s => s.status = 'pending');
  closeConfirm();
  updateStats(); renderNav(); render();
  persistStorage();
  toast('All progress reset', 'ok');
}

// ─── TOAST ───────────────────────────────────────────────────────────────────
let _t;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg; el.className = 'toast ' + type + ' show';
  clearTimeout(_t); _t = setTimeout(() => el.classList.remove('show'), 2500);
}

// ─── KEYBOARD ────────────────────────────────────────────────────────────────
document.getElementById('ov').addEventListener('click', e => { if (e.target === document.getElementById('ov')) closeM(); });
document.getElementById('ov-confirm').addEventListener('click', e => { if (e.target === document.getElementById('ov-confirm')) closeConfirm(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeM(); closeConfirm(); } });

// ─── EVENT DELEGATION (fixes onclick quote issues) ───────────────────────────
document.getElementById('box').addEventListener('click', function(e) {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  const action = btn.dataset.action;
  const id = btn.dataset.id;
  if (action === 'cycle') cycle(id);
  else if (action === 'edit') openEdit(id);
  else if (action === 'del') { if(confirm('Delete this skill?')) del(id); }
});

init();
</script>
</body>
</html>
